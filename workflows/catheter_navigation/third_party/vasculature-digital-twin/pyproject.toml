[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasculature-digital-twin"
version = "0.1.0"
description = "CT ingestion and vessel digital-twin preprocessing utilities."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
io = [
  "SimpleITK>=2.3",
  "nibabel>=5.0",
]
segmentation = [
  "scikit-image>=0.22",
  "totalsegmentator>=2.7",
  "nibabel>=5.0",
]
mesh = [
  "vtk>=9.2",
  "warp-lang>=1.3",
]
all = [
  "SimpleITK>=2.3",
  "nibabel>=5.0",
  "scikit-image>=0.22",
  "totalsegmentator>=2.7",
  "vtk>=9.2",
  "warp-lang>=1.3",
]

[project.scripts]
vdt-preprocess-ct = "vasculature_digital_twin.cli.preprocess_ct:main"
vdt-segment-vessels = "vasculature_digital_twin.cli.segment_vessels:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
