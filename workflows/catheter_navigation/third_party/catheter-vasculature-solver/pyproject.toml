[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catheter-vasculature-solver"
version = "0.1.0"
description = "XPBD catheter and guidewire solvers for vasculature navigation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "warp-lang>=1.3",
]

[project.optional-dependencies]
newton = [
  "newton",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
