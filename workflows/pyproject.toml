[project]
name = "i4h-workflows"
version = "0.1.0"
description = "Authored workflows: one module per runnable workflow. Light by design — no Isaac, no policy stacks."
requires-python = ">=3.11, <3.13"
dependencies = [
    "i4h-common",
    "i4h-engine",
    "i4h-tasks-basic",
    "i4h-tasks-rsl-rl",
    "i4h-tasks-ik",
    "i4h-tasks-teleop",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_workflows", "i4h_workflow_modes"]

[tool.uv.sources]
i4h-common = { path = "../common", editable = true }
i4h-engine = { path = "../engine", editable = true }
i4h-tasks-basic = { path = "../tasks/basic", editable = true }
i4h-tasks-rsl-rl = { path = "../tasks/rsl_rl", editable = true }
i4h-tasks-ik = { path = "../tasks/ik", editable = true }
i4h-tasks-teleop = { path = "../tasks/teleop", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]
