description: Spread a deformable tablecloth with a Unitree G1 and Inspire hands.
scene: g1_tablecloth
# Cloth needs Newton, and the pinned USD parser needs one thread for these bodies.
launcher_args: [--presets, newton]
env: {PXR_WORK_THREAD_LIMIT: "1"}
modes:
  teleop:
    xr: true
