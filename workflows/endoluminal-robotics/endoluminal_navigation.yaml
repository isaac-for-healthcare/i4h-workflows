description: Navigate a catheter and movable C-arm with a live fluoroscopy view.
scene: endoluminal_navigation
# The catheter is a Newton rod.
launcher_args: [--presets, newton]
modes:
  demo:
    policy: i4h_arena.policies.catheter.CatheterSweepPolicy
    environment_args: [--episode_steps, "192"]
  validate_fluoroscopy:
    policy: i4h_arena.policies.catheter.FluoroscopyCArmSweepPolicy
    environment_args: [--episode_steps, "80"]
  teleop:
    devices: [catheter_keyboard]
  policy_n17:
    server: {stack: gr00t_n17, task: catheter_navigation}
    checkpoint: required
    policy: i4h_arena.policies.gr00t_n17.Gr00tN17RemotePolicy
    args: [--embodiment, catheter]
