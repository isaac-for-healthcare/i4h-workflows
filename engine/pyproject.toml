[project]
name = "i4h-engine"
version = "0.1.0"
description = "Workflow execution engine and task/scene registries. No domain knowledge, no Isaac."
requires-python = ">=3.11, <3.13"
dependencies = ["i4h-common"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i4h-workflow = "i4h_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_engine"]

[tool.uv.sources]
i4h-common = { path = "../common", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
