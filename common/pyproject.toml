[project]
name = "i4h-common"
version = "0.1.0"
description = "Isaac-free contracts, zenoh bus and HDF5 episode schema shared across workflows."
requires-python = ">=3.11, <3.13"
dependencies = [
    "numpy>=1.23.5,<3",
    "eclipse-zenoh",
    "msgpack>=1.0",
    "h5py>=3.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_common"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
