[project]
name = "i4h-workflows-rl"
version = "0.1.0"
description = "Workflow-owned online reinforcement-learning profiles and launchers."
requires-python = ">=3.11, <3.13"
dependencies = [
    "PyYAML>=6.0",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
]

[project.optional-dependencies]
dev = [
    "imageio==2.34.2",
    "av==12.3.0",
    "torch==2.9.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
i4h-train-rl = "i4h_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_rl"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
