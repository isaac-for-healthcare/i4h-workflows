defaults:
- override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # RLinf model + lightweight environment proxy share GPU 0. The Workflow
    # Isaac Sim server is launched separately on GPU 1 by i4h_rl.cli.
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: i4h-workflows
    experiment_name: assemble_trocar_rl
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  eval_policy_path: null
  val_check_interval: -1
  save_interval: 2
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  channel:
    name: env_buffer_list
    queue_name: obs_buffer
    queue_size: 0
  enable_offload: false
  train:
    env_type: isaaclab
    total_num_envs: 64
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: true
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 8
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 250
    max_episode_steps: 250
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: I4H-Workflows-Assemble-Trocar-RLinf-v0
      num_envs: null
      max_episode_steps: ${env.train.max_episode_steps}
      task_description: install trocar from box
    isaaclab: &workflow_trocar
      task_description: install trocar from box
      main_images: front_camera_rgb
      extra_view_images: [left_wrist_camera_rgb, right_wrist_camera_rgb]
      states:
      - key: robot_joint_state
        slice: [15, 29]
      - key: robot_dex3_joint_state
      gr00t_mapping:
        video:
          main_images: video.room_view
          extra_view_images: [video.left_wrist_view, video.right_wrist_view]
        state:
        - gr00t_key: state.left_arm
          slice: [0, 7]
        - gr00t_key: state.right_arm
          slice: [7, 14]
        - gr00t_key: state.left_hand
          slice: [14, 21]
        - gr00t_key: state.right_hand
          slice: [21, 28]
      action_mapping:
        prefix_pad: 15
        suffix_pad: 0
      obs_converter_type: i4h_g1_dex3
      embodiment_tag: new_embodiment
      embodiment_tag_id: 31
      data_config_class: i4h_tasks.gr00t_n15.assemble_trocar.infer.data_config:UnitreeG1AssembleTrocarDataConfig
  eval:
    env_type: isaaclab
    total_num_envs: 64
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: true
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 250
    max_episode_steps: 250
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: I4H-Workflows-Assemble-Trocar-RLinf-Eval-v0
      num_envs: null
      max_episode_steps: ${env.eval.max_episode_steps}
      task_description: install trocar from box
    isaaclab: *workflow_trocar

rollout:
  group_name: RolloutGroup
  channel:
    name: ${env.channel.name}
    queue_name: action_buffer
    queue_size: 0
  mode: colocate
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
  model:
    model_path: /models/replace-with-local-sft-checkpoint
    rl_model_path: null
    precision: ${actor.model.precision}
    obs_converter_type: ${env.train.isaaclab.obs_converter_type}
    embodiment_tag: ${env.train.isaaclab.embodiment_tag}

actor:
  group_name: ActorGroup
  channel:
    name: ${env.channel.name}
    queue_name: replay_buffer
    queue_size: 0
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 2048
  seed: 1234
  enable_offload: false
  model:
    model_type: gr00t
    model_path: /models/replace-with-local-sft-checkpoint
    precision: bf16
    trust_remote_code: true
    is_lora: false
    action_dim: 28
    num_action_chunks: 1
    denoising_steps: 4
    policy_setup: widowx_bridge
    obs_converter_type: ${env.train.isaaclab.obs_converter_type}
    embodiment_tag: ${env.train.isaaclab.embodiment_tag}
    add_value_head: true
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.3
      add_value_head: ${actor.model.add_value_head}
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 850
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728

reward:
  use_reward_model: false

critic:
  use_critic_model: false
