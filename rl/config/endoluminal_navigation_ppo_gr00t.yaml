defaults:
- override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # RLinf model + lightweight environment proxy use logical GPU 0. This
    # workflow profile colocates its isolated Isaac Sim process on the same
    # physical GPU; each process therefore sees its selected device as cuda:0.
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: i4h-workflows
    experiment_name: endoluminal_navigation_rl
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: -1
  only_eval: false
  eval_policy_path: null
  val_check_interval: -1
  save_interval: 2
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  # Curved centerline progress pays out in small per-step increments over
  # hundreds of steps rather than at the end. Discounting at 0.99 over a
  # 600-step episode would leave early progress nearly worthless; 0.995 keeps
  # it visible.
  gamma: 0.995
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  channel:
    name: env_buffer_list
    queue_name: obs_buffer
    queue_size: 0
  enable_offload: false
  train:
    env_type: isaaclab
    total_num_envs: 8
    auto_reset: false
    ignore_terminations: false
    # Required by `IsaaclabBaseEnv.__init__` but inert: the only reader is
    # `_calc_step_reward`, which has no caller in the pinned RLinf's IsaacLab
    # path, so the scene's reward reaches PPO untouched. `reward_coef` below,
    # and the one under `algorithm`, are dead for the same reason. False rather
    # than true because `route_progress_reward` is already a per-step
    # difference of remaining arc length, so if upstream wires the method the
    # way `frankasim` and `genesis` do -- passing the real reward rather than
    # the termination flag -- differencing it again would be wrong.
    use_rel_reward: false
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 8
    # Matches the scene's validated step cap. Do not raise this to buy a
    # higher success rate; a policy that needs longer than the cap is not
    # solving the task the cap defines.
    max_steps_per_rollout_epoch: 600
    max_episode_steps: 600
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: I4H-Workflows-Endoluminal-Navigation-RLinf-v0
      num_envs: null
      max_episode_steps: ${env.train.max_episode_steps}
      task_description: navigate the catheter through the vessel to the target
    isaaclab: &workflow_catheter
      task_description: navigate the catheter through the vessel to the target
      # One camera. The C-arm is the only view a real operator has, so there
      # is no wrist or room equivalent to fill extra_view_images with, and
      # inventing a second angle would not match the clinical observation.
      main_images: fluoroscopy_rgb
      extra_view_images: []
      states:
      - key: drive_state
      - key: tip_position
      - key: tip_direction
      - key: target_offset
      - key: route_state
      # The policy sees drive state plus the task goal and route progress. Tip
      # position and direction remain simulator-side observations.
      gr00t_mapping:
        video:
          main_images: video.fluoroscopy
          extra_view_images: []
        state:
        # Insertion depth, axial twist, tip bend.
        - gr00t_key: state.catheter
          slice: [0, 3]
        # The gantry angle, which changes the view and nothing in the patient.
        - gr00t_key: state.carm
          slice: [3, 4]
        # Vector from catheter tip to the target branch.
        - gr00t_key: state.target
          slice: [10, 13]
        # Remaining centerline arc and lateral offset.
        - gr00t_key: state.route
          slice: [13, 15]
      action_mapping:
        prefix_pad: 0
        suffix_pad: 0
      obs_converter_type: i4h_catheter_carm
      embodiment_tag: new_embodiment
      embodiment_tag_id: 32
      # No `data_config_class`: that is an N1.5 import-string mechanism, and
      # setting it diverts model loading to the IsaacLab extension's own
      # loader, which hardcodes the N1.5 model class. Left unset, the
      # extension registers the embodiment tag and defers to RLinf's
      # `get_model`, which honours `actor.model.model_type` below. The N1.7
      # equivalent of the data config is the modality registration the
      # adapter imports from `i4h_tasks.gr00t_n17.config_catheter`.
  eval:
    env_type: isaaclab
    total_num_envs: 8
    auto_reset: true
    ignore_terminations: true
    # Inert here too; see `train.use_rel_reward`.
    use_rel_reward: false
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 1
    max_steps_per_rollout_epoch: 600
    max_episode_steps: 600
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: I4H-Workflows-Endoluminal-Navigation-RLinf-Eval-v0
      num_envs: null
      max_episode_steps: ${env.eval.max_episode_steps}
      task_description: navigate the catheter through the vessel to the target
    isaaclab: *workflow_catheter

rollout:
  group_name: RolloutGroup
  channel:
    name: ${env.channel.name}
    queue_name: action_buffer
    queue_size: 0
  mode: colocate
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
  model:
    model_type: ${actor.model.model_type}
    model_path: /models/replace-with-local-sft-checkpoint
    rl_model_path: null
    precision: ${actor.model.precision}
    obs_converter_type: ${env.train.isaaclab.obs_converter_type}
    embodiment_tag: ${env.train.isaaclab.embodiment_tag}

actor:
  group_name: ActorGroup
  channel:
    name: ${env.channel.name}
    queue_name: replay_buffer
    queue_size: 0
  training_backend: fsdp
  micro_batch_size: 2
  # Constrained only by `micro_batch_size` * actor world size, which is all
  # RLinf asserts for an embodied FSDP run; it does not need to divide the
  # rollout, and `io_struct._get_global_batches` tolerates one that does not.
  # A rollout is rollout_epoch * max_steps_per_rollout_epoch * envs =
  # 8 * 600 * 8 = 38,400 samples, where the env count comes from the profile's
  # `default_num_envs` by way of `--num-envs`; the `total_num_envs` above is
  # overwritten by the launcher and cannot change this arithmetic.
  global_batch_size: 240
  seed: 1234
  enable_offload: false
  model:
    # Selects which GR00T generation RLinf builds. The catheter SFT checkpoint
    # reports `Gr00tN1d7`, and each generation reads only its own action
    # converter registry, so a mismatch here surfaces as a missing converter
    # mid-rollout rather than a load error.
    model_type: gr00t_n1d7
    model_path: /models/replace-with-local-sft-checkpoint
    precision: bf16
    trust_remote_code: true
    is_lora: false
    action_dim: 4
    num_action_chunks: 1
    denoising_steps: 4
    obs_converter_type: ${env.train.isaaclab.obs_converter_type}
    embodiment_tag: ${env.train.isaaclab.embodiment_tag}
    add_value_head: true
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.3
      add_value_head: ${actor.model.add_value_head}
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 850
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    # N1.7 freezes part of the pretrained backbone while training the policy
    # head. FSDP flat parameters cannot mix those requires_grad values.
    use_orig_params: true
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728

reward:
  use_reward_model: false

critic:
  use_critic_model: false
