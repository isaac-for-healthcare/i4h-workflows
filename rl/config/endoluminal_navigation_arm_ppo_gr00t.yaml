#
# GR00T PPO post-training for catheter navigation in the arm-borne Scene.
#
# A near-copy of `endoluminal_navigation_ppo_gr00t.yaml`, differing only in the
# two task ids, the experiment name and the environment count. Everything the
# policy and the optimiser see is identical, because the arm changes who holds
# the drive unit and nothing the observation, action space or reward is built
# from.
#
# Copied rather than composed. `defaults:` inheritance would read fine to
# Hydra but not to `i4h_rl.backends.rlinf.validate_profile`, which loads this
# file with plain `yaml.safe_load` to cross-check it against the profile; an
# inherited `env.train.init_params.id` would be absent from the raw mapping and
# the run would be refused as an incomplete configuration. The drift that
# copying invites is covered by a test asserting these two files differ only on
# an allowlist.

defaults:
- override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # RLinf model + lightweight environment proxy use logical GPU 0. This
    # workflow profile colocates its isolated Isaac Sim process on the same
    # physical GPU; each process therefore sees its selected device as cuda:0.
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: i4h-workflows
    experiment_name: endoluminal_navigation_arm_rl
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: -1
  only_eval: false
  eval_policy_path: null
  val_check_interval: -1
  save_interval: 2
  seq_length: 4096
  max_prompt_length: 30
  resume_dir: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  # The dense reward is potential-based on remaining arc, so a traverse pays
  # out in small per-step increments over hundreds of steps rather than at
  # the end. Discounting at 0.99 over a 600-step episode would leave the
  # early shaping nearly worthless; 0.995 keeps it visible.
  gamma: 0.995
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  channel:
    name: env_buffer_list
    queue_name: obs_buffer
    queue_size: 0
  enable_offload: false
  train:
    env_type: isaaclab
    total_num_envs: 4
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: true
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 8
    # Matches the scene's validated step cap. Do not raise this to buy a
    # higher success rate; a policy that needs longer than the cap is not
    # solving the task the cap defines.
    max_steps_per_rollout_epoch: 600
    max_episode_steps: 600
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: I4H-Workflows-Endoluminal-Navigation-Arm-RLinf-v0
      num_envs: null
      max_episode_steps: ${env.train.max_episode_steps}
      task_description: navigate the catheter through the vessel to the target
    isaaclab: &workflow_catheter
      task_description: navigate the catheter through the vessel to the target
      # One camera. The C-arm is the only view a real operator has, so there
      # is no wrist or room equivalent to fill extra_view_images with, and
      # inventing a second angle would not match the clinical observation.
      main_images: fluoroscopy_rgb
      extra_view_images: []
      states:
      - key: drive_state
      - key: tip_position
      - key: tip_direction
      - key: target_offset
      - key: route_state
      # These are the groups the fine-tuned checkpoint's processor declares,
      # and they are the whole of what the policy sees. The Scene publishes
      # eleven further numbers -- tip pose, target offset, route state -- which
      # stay on the environment side: the checkpoint's state projector is sized
      # for four values, and a group it does not declare is dropped in silence
      # rather than refused. The reward terms read that geometry directly, so
      # withholding it from the policy costs the critic nothing.
      gr00t_mapping:
        video:
          main_images: video.fluoroscopy
          extra_view_images: []
        state:
        # Insertion depth, axial twist, tip bend.
        - gr00t_key: state.catheter
          slice: [0, 3]
        # The gantry angle, which changes the view and nothing in the patient.
        - gr00t_key: state.carm
          slice: [3, 4]
      action_mapping:
        prefix_pad: 0
        suffix_pad: 0
      obs_converter_type: i4h_catheter_carm
      embodiment_tag: new_embodiment
      embodiment_tag_id: 32
      # No `data_config_class`: that is an N1.5 import-string mechanism, and
      # setting it diverts model loading to the IsaacLab extension's own
      # loader, which hardcodes the N1.5 model class. Left unset, the
      # extension registers the embodiment tag and defers to RLinf's
      # `get_model`, which honours `actor.model.model_type` below. The N1.7
      # equivalent of the data config is the modality registration the
      # adapter imports from `i4h_tasks.gr00t_n17.config_catheter`.
  eval:
    env_type: isaaclab
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: true
    seed: 0
    group_size: 1
    reward_coef: 1.0
    rollout_epoch: 1
    max_steps_per_rollout_epoch: 600
    max_episode_steps: 600
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: I4H-Workflows-Endoluminal-Navigation-Arm-RLinf-Eval-v0
      num_envs: null
      max_episode_steps: ${env.eval.max_episode_steps}
      task_description: navigate the catheter through the vessel to the target
    isaaclab: *workflow_catheter

rollout:
  group_name: RolloutGroup
  channel:
    name: ${env.channel.name}
    queue_name: action_buffer
    queue_size: 0
  mode: colocate
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
  model:
    model_type: ${actor.model.model_type}
    model_path: /models/replace-with-local-sft-checkpoint
    rl_model_path: null
    precision: ${actor.model.precision}
    obs_converter_type: ${env.train.isaaclab.obs_converter_type}
    embodiment_tag: ${env.train.isaaclab.embodiment_tag}

actor:
  group_name: ActorGroup
  channel:
    name: ${env.channel.name}
    queue_name: replay_buffer
    queue_size: 0
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    # Selects which GR00T generation RLinf builds. The catheter SFT checkpoint
    # reports `Gr00tN1d7`, and each generation reads only its own action
    # converter registry, so a mismatch here surfaces as a missing converter
    # mid-rollout rather than a load error.
    model_type: gr00t_n1d7
    model_path: /models/replace-with-local-sft-checkpoint
    precision: bf16
    trust_remote_code: true
    is_lora: false
    action_dim: 4
    num_action_chunks: 1
    denoising_steps: 4
    policy_setup: widowx_bridge
    obs_converter_type: ${env.train.isaaclab.obs_converter_type}
    embodiment_tag: ${env.train.isaaclab.embodiment_tag}
    add_value_head: true
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params: [0.7, 0.3, 400]
      noise_level: 0.3
      add_value_head: ${actor.model.add_value_head}
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 850
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728

reward:
  use_reward_model: false

critic:
  use_critic_model: false
