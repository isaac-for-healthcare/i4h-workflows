[project]
name = "i4h-tasks-ik"
version = "0.1.0"
description = "IK / operational-space task nodes. runtime=inprocess — installed into the arena venv."
requires-python = ">=3.11, <3.13"
dependencies = [
    "i4h-common",
    "i4h-engine",
    "numpy>=1.23.5,<3",
    "osqp>=0.6.7.post3",
    "qpsolvers==4.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "i4h-tasks-basic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_tasks"]

[tool.uv.sources]
i4h-common = { path = "../../common", editable = true }
i4h-engine = { path = "../../engine", editable = true }
i4h-tasks-basic = { path = "../basic", editable = true }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
