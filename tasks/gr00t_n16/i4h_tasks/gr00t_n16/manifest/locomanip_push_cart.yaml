#
# The checkpoint and its finetuning defaults. Inference runs on GR00T's own
# run_gr00t_server.py with Arena's GR00T client (tasks/gr00t_n16/config/);
# the IsaacLab-Arena environment supplies the prompt.
#
# train is read only by this stack's train.py, in this stack's own venv.
# `train:` present -> finetunable.

summary: Walk to the cart and push it forward
prompt: Go to the left side of the cart, turn around to face the cart, grasp the cart handles with both hands, and push the cart forward to the destination.
embodiment: g1
cameras:
- head
model:
  repo: nvidia/GR00T-N1.6-Rheo-Sim-PushCart
  revision: 0e24b9b225da4a2cff53049eb8b6e57f435814ec
  embodiment_tag: new_embodiment
train:
  output_dir: /tmp/gr00t_g1_cart
  base_model: nvidia/GR00T-N1.6-3B
  max_steps: 20000
  save_steps: 2000
  batch_size: 16
  tune_visual: true
  # The cameras the trainer asks for: the head camera alone (``ego_view``),
  # which is what the G1 scenes record and the base checkpoints were trained
  # on. Resolved against the repository root.
  modality_config_path: tasks/gr00t_n16/i4h_tasks/gr00t_n16/locomanip/config_head.py
