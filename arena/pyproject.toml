[project]
name = "i4h-arena"
version = "0.1.0"
description = "IsaacLab-Arena integration: scenes, adapters and the workflow runner."
requires-python = ">=3.12, <3.13"
dependencies = [
    "i4h-common",
    "i4h-engine",
    "i4h-workflows",
    "i4h-tasks-basic",
    "i4h-tasks-rsl-rl",
    "i4h-tasks-ik",
    "i4h-tasks-teleop",
    "catheter-vasculature-solver",
    "xray-simulator[slang]",
    "numpy>=2,<3",
    "Pillow>=10.0",
    "h5py>=3.10",
    "hydra-core==1.3.2",
    "onnxruntime>=1.19",
    "pyzmq>=26,<28",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    # Isaac Lab 3.0 keeps every third-party requirement in its root isaaclab-dev project (Isaac Sim 6.1.0.0, Newton
    # 1.6.1, Warp 1.17.0, torch 2.12.0); the workspace members are named too so their path sources apply.
    "isaaclab-dev[isaacsim,ov,mimic,teleop,rsl-rl]",
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-contrib",
    "isaaclab-experimental",
    "isaaclab-mimic",
    "isaaclab-newton",
    "isaaclab-ov",
    "isaaclab-physx",
    "isaaclab-ppisp",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-tasks-experimental",
    "isaaclab-teleop",
    "isaaclab-visualizers",
    "leisaac",
    "isaaclab-arena",
    "warp-lang==1.17.0",
    "osqp>=0.6.7.post3",
    "qpsolvers==4.8.1",
]

[project.scripts]
i4h-arena = "i4h_arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_arena"]

[tool.uv.sources]
i4h-common = { path = "../common", editable = true }
i4h-engine = { path = "../engine", editable = true }
i4h-workflows = { path = "../workflows", editable = true }
i4h-tasks-basic = { path = "../tasks/basic", editable = true }
i4h-tasks-rsl-rl = { path = "../tasks/rsl_rl", editable = true }
i4h-tasks-ik = { path = "../tasks/ik", editable = true }
i4h-tasks-teleop = { path = "../tasks/teleop", editable = true }
isaacsim = { index = "nvidia" }
isaaclab-dev = { path = "../third_party/IsaacLab-6864dd1", editable = true }
isaaclab = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab", editable = true }
isaaclab-assets = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_assets", editable = true }
isaaclab-contrib = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_contrib", editable = true }
isaaclab-experimental = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_experimental", editable = true }
isaaclab-mimic = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_mimic", editable = true }
isaaclab-newton = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_newton", editable = true }
isaaclab-ov = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_ov", editable = true }
isaaclab-physx = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_physx", editable = true }
isaaclab-ppisp = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_ppisp", editable = true }
isaaclab-rl = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_tasks", editable = true }
isaaclab-tasks-experimental = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_tasks_experimental", editable = true }
isaaclab-teleop = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_teleop", editable = true }
isaaclab-visualizers = { path = "../third_party/IsaacLab-6864dd1/source/isaaclab_visualizers", editable = true }
leisaac = { path = "../third_party/leisaac-cd61a20/source/leisaac", editable = true }
isaaclab-arena = { path = "../third_party/IsaacLab-Arena-5660182", editable = true }
catheter-vasculature-solver = { path = "../third_party/i4h-physics-simulation-internal/physics_simulation/endoluminal/catheter-vasculature-solver", editable = true }
xray-simulator = { path = "../third_party/i4h-sensor-simulation-internal/xray-simulator", editable = true }
torch = { index = "pytorch-cu130" }  # Isaac Lab 3.0's torch index on both architectures
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
environments = [
    'sys_platform == "linux" and platform_machine == "x86_64"',
    'sys_platform == "linux" and platform_machine == "aarch64"',
]
index-strategy = "unsafe-best-match"
prerelease = "allow"
python-preference = "only-managed"
override-dependencies = [
    "coverage==7.4.4",
    "numpy>=2,<3",
    "packaging==26.0",
    "gymnasium==1.2.1",
    'pywin32==306 ; sys_platform == "win32"',
    "torch==2.12.0",
    "torchvision==0.27.0",
    "uvicorn>=0.31.1",
    "warp-lang==1.17.0",
    # Isaac Lab 3.0's own overrides (its root pyproject): overrides do not propagate from a dependency, and the
    # isaacsim 6.1 extras pin older versions of these. pxr comes from usd-exchange (no usd-core).
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.0",
    "usd-optimize~=1.3.0",
    "websockets==12.0",
]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake<4"]
flatdict = ["setuptools<80"]

[tool.ruff]
line-length = 120
