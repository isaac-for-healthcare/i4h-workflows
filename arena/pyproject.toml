[project]
name = "i4h-arena"
version = "0.1.0"
description = "IsaacLab-Arena integration: scenes, adapters and the workflow runner."
requires-python = ">=3.12, <3.13"
dependencies = [
    "i4h-common",
    "i4h-engine",
    "i4h-workflows",
    "i4h-tasks-basic",
    "i4h-tasks-rsl-rl",
    "i4h-tasks-ik",
    "i4h-tasks-teleop",
    "catheter-vasculature-solver",
    "xray-simulator[slang]",
    "numpy>=2,<3",
    "Pillow>=10.0",
    "h5py>=3.10",
    "hydra-core==1.3.2",
    "onnxruntime>=1.19",
    "pyzmq>=26,<28",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "isaacsim[all,extscache]==6.0.1",
    "isaaclab",
    "isaaclab-mimic",
    "isaaclab-newton",
    "isaaclab-ov",
    "isaaclab-physx",
    "isaaclab-rl[rsl-rl]",
    "isaaclab-tasks",
    "isaaclab-teleop",
    "isaaclab-visualizers",
    "isaaclab-assets",
    "leisaac",
    "isaaclab-arena",
    "warp-lang==1.13.0",
    "osqp>=0.6.7.post3",
    "qpsolvers==4.8.1",
]

[project.scripts]
i4h-arena = "i4h_arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_arena"]

[tool.uv.sources]
i4h-common = { path = "../common", editable = true }
i4h-engine = { path = "../engine", editable = true }
i4h-workflows = { path = "../workflows", editable = true }
i4h-tasks-basic = { path = "../tasks/basic", editable = true }
i4h-tasks-rsl-rl = { path = "../tasks/rsl_rl", editable = true }
i4h-tasks-ik = { path = "../tasks/ik", editable = true }
i4h-tasks-teleop = { path = "../tasks/teleop", editable = true }
isaacsim = { index = "nvidia" }
isaaclab = { path = "../third_party/IsaacLab-ffff603/source/isaaclab", editable = true }
isaaclab-mimic = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_mimic", editable = true }
isaaclab-newton = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_newton", editable = true }
isaaclab-ov = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_ov", editable = true }
isaaclab-physx = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_physx", editable = true }
isaaclab-rl = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_tasks", editable = true }
isaaclab-teleop = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_teleop", editable = true }
isaaclab-visualizers = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_visualizers", editable = true }
isaaclab-assets = { path = "../third_party/IsaacLab-ffff603/source/isaaclab_assets", editable = true }
leisaac = { path = "../third_party/leisaac-cd61a20/source/leisaac", editable = true }
isaaclab-arena = { path = "../third_party/IsaacLab-Arena-0a1b8c2", editable = true }
catheter-vasculature-solver = { path = "../third_party/i4h-physics-simulation-internal/physics_simulation/endoluminal/catheter-vasculature-solver", editable = true }
xray-simulator = { path = "../third_party/i4h-sensor-simulation-internal/xray-simulator", editable = true }
torch = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
environments = [
    'sys_platform == "linux" and platform_machine == "x86_64"',
    'sys_platform == "linux" and platform_machine == "aarch64"',
]
index-strategy = "unsafe-best-match"
prerelease = "allow"
python-preference = "only-managed"
override-dependencies = [
    "coverage==7.4.4",
    'usd-core>=25.11,<26 ; platform_machine == "x86_64"',
    "numpy>=2,<3",
    "packaging==26.0",
    "gymnasium==1.2.1",
    'pywin32==306 ; sys_platform == "win32"',
    "torch==2.10.0",
    "torchvision==0.25.0",
    "uvicorn>=0.31.1",
    "warp-lang==1.13.0",
    "websockets==12.0",
]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake<4"]
flatdict = ["setuptools<80"]

[tool.ruff]
line-length = 120
