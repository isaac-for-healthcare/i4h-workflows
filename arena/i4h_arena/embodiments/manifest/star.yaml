#
# Robot facts that must cross a venv boundary and are not already stated by
# the IsaacLab articulation cfg beside this file:
#   - LeRobot column names and splits, read by tools/dataset
#   - teleop device list and leader calibration, read by tasks/teleop
#   - home pose and control rate, read by arena when building a scene
#
# dof / action_space / gripper are NOT here: the scene declares them, because
# the same arm can be mounted under different controllers.

