#
# Robot facts that must cross a venv boundary and are not already stated by
# the IsaacLab articulation cfg beside this file:
#   - LeRobot column names and splits, read by tools/dataset
#   - teleop device list and leader calibration, read by tasks/teleop
#   - home pose and control rate, read by arena when building a scene
#
# dof / action_space / gripper are NOT here: the scene declares them, because
# the same arm can be mounted under different controllers.

name: dvrk_dual_psm
joint_names:
- left.psm_yaw_joint
- left.psm_pitch_end_joint
- left.psm_main_insertion_joint
- left.psm_tool_roll_joint
- left.psm_tool_pitch_joint
- left.psm_tool_yaw_joint
- left.psm_tool_gripper1_joint
- left.psm_tool_gripper2_joint
- right.psm_yaw_joint
- right.psm_pitch_end_joint
- right.psm_main_insertion_joint
- right.psm_tool_roll_joint
- right.psm_tool_pitch_joint
- right.psm_tool_yaw_joint
- right.psm_tool_gripper1_joint
- right.psm_tool_gripper2_joint
action_names:
- left.ee.x
- left.ee.y
- left.ee.z
- left.ee.qx
- left.ee.qy
- left.ee.qz
- left.ee.qw
- right.ee.x
- right.ee.y
- right.ee.z
- right.ee.qx
- right.ee.qy
- right.ee.qz
- right.ee.qw
state_names:
- left.psm_yaw_joint.pos
- left.psm_pitch_end_joint.pos
- left.psm_main_insertion_joint.pos
- left.psm_tool_roll_joint.pos
- left.psm_tool_pitch_joint.pos
- left.psm_tool_yaw_joint.pos
- left.psm_tool_gripper1_joint.pos
- left.psm_tool_gripper2_joint.pos
- right.psm_yaw_joint.pos
- right.psm_pitch_end_joint.pos
- right.psm_main_insertion_joint.pos
- right.psm_tool_roll_joint.pos
- right.psm_tool_pitch_joint.pos
- right.psm_tool_yaw_joint.pos
- right.psm_tool_gripper1_joint.pos
- right.psm_tool_gripper2_joint.pos
teleop_devices:
- keyboard
