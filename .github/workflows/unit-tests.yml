name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CPU tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true
          prune-cache: false
          cache-python: true
          cache-dependency-glob: |
            workflows/uv.lock
            tools/dataset/uv.lock
            tools/mimic/uv.lock
            tools/patient_twin/uv.lock

      - name: Run CPU tests with coverage
        run: python scripts/run_tests.py --suite ci --coverage

      - name: Add coverage to the job summary
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        run: |
          echo '## CPU unit-test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          uv run --project workflows --with coverage==7.4.4 \
            coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
