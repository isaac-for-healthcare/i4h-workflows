name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CPU tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Match the public release component used by third_party/setup.sh.
      - name: Checkout the patient digital twin component
        uses: actions/checkout@v4
        with:
          repository: isaac-for-healthcare/i4h-digital-twin
          ref: ca68500f2eaa9c1fb504dd5963ffb27a9cf6d4cd # v0.9.0-rc3
          path: third_party/i4h-digital-twin-internal
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true
          prune-cache: false
          cache-python: true
          cache-dependency-glob: |
            rl/uv.lock
            workflows/uv.lock
            tools/dataset/uv.lock
            tools/mimic/uv.lock
            tools/patient_twin/uv.lock

      - name: Provision pinned RLinf CPU regression source
        run: bash scripts/setup_rl_cpu.sh

      - name: Run CPU tests with coverage
        run: python scripts/run_tests.py --suite ci --coverage

      - name: Add coverage to the job summary
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        run: |
          echo '## CPU unit-test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          uv run --project workflows --with coverage==7.4.4 \
            coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  draft-rl-tests:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    name: Draft RL CPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: rl/uv.lock
      - name: Provision pinned RLinf CPU regression source
        run: bash scripts/setup_rl_cpu.sh
      - name: Run RL CPU suite
        run: python scripts/run_tests.py --suite rl
