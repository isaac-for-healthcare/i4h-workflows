name: Check Markdown Links

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check for broken links
        # Generated skill reports are copied verbatim with their OMS signatures.
        # Keep authored SKILL.md and reference documentation in the checked set.
        run: |
          find . -name "*.md" ! -name "whatsnew_*.md" \
            ! -path "./skills/*/BENCHMARK.md" \
            ! -path "./skills/*/skill-card.md" -print0 \
            | xargs -0 -r -I {} markdown-link-check {} --config .github/markdown-link-check.json
