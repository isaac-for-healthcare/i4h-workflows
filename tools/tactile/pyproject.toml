[project]
name = "i4h-tools-tactile"
version = "0.1.0"
description = "Inspect, visualise and convert fingertip tactile recordings in LeRobot datasets."
requires-python = ">=3.11, <3.13"
dependencies = [
    "i4h-common",
    "numpy>=1.23.5,<3",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i4h-tactile = "i4h_tools.tactile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_tools"]

[tool.uv.sources]
i4h-common = { path = "../../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
