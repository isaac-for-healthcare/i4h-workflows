[project]
name = "i4h-tools-patient-twin"
version = "0.1.0"
description = "Pinned environment for building Arena patient twins with patient-digital-twin."
requires-python = ">=3.12,<3.13"
dependencies = [
    "patient-digital-twin",
    "scipy==1.15.3",
    "vtk>=9.3",
    "usd-core==25.5.1; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "usd-exchange>=2.2; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[project.optional-dependencies]
dicom = ["patient-digital-twin[dicom]"]
nvsegment = ["patient-digital-twin[nvsegment]"]
nvgenerate = ["patient-digital-twin[nvgenerate]"]

[tool.uv.sources]
patient-digital-twin = { path = "../../third_party/i4h-digital-twin/patient-digital-twin", editable = true }

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
