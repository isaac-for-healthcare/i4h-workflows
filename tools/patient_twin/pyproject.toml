[project]
name = "i4h-tools-patient-twin"
version = "0.1.0"
description = "Build an Arena fluoroscopy patient twin from a TotalSegmentator subject."
requires-python = ">=3.12,<3.13"
dependencies = [
    "nibabel==5.3.2",
    "numpy==2.2.6",
    "PyYAML==6.0.2",
    "scikit-image==0.25.2",
    "scipy==1.15.3",
    "trimesh==4.11.1",
    "usd-core==25.5.1; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "usd-exchange>=2.2; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "vasculature-digital-twin",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i4h-patient-twin = "i4h_tools.patient_twin.cli:main"

[tool.uv.sources]
vasculature-digital-twin = { path = "../../third_party/i4h-digital-twin-internal/patient-digital-twin/vasculature_digital_twin", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_tools"]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
