[project]
name = "i4h-tools-annotator"
version = "0.1.0"
description = "VLM task verifier for offline recordings and live camera streams."
requires-python = ">=3.11, <3.12"
dependencies = [
    "i4h-common",
    "numpy>=1.23.5,<2",
    "openai>=1.59",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i4h-annotator = "i4h_tools.annotator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_tools"]

[tool.uv.sources]
i4h-common = { path = "../../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120
