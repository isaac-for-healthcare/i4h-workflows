[project]
name = "i4h-tools-dataset"
version = "0.1.0"
description = "HDF5 → LeRobot dataset converter and inspector."
requires-python = ">=3.11, <3.12"
dependencies = [
    "i4h-common",
    "numpy>=1.23.5,<2",
    "tqdm>=4.66",
    "lerobot",
    # Pin below 4.x: lerobot==0.x's LeRobotDataset.__init__ calls
    # torch.stack(hf_dataset["timestamp"]), which crashes with
    # "must be tuple of Tensors, not Column" on datasets>=4.0.
    "datasets<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i4h-dataset = "i4h_tools.dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_tools"]

[tool.uv.sources]
i4h-common = { path = "../../common", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "483be9aac217c2d8ef16982490f22b2ad091ab46" }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120
