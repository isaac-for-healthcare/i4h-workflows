[project]
name = "i4h-tools-cosmos"
version = "0.1.0"
description = "HDF5 visual expansion adapter for NVIDIA Cosmos."
requires-python = ">=3.11"
dependencies = [
    "i4h-common",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26,<3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
i4h-cosmos = "i4h_tools.cosmos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["i4h_tools"]

[tool.uv.sources]
i4h-common = { path = "../../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120
