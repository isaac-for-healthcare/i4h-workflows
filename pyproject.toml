# This directory is not a uv workspace. Each sub-component (common, engine,
# workflows, tasks/*, arena, tools/*) is an independent uv project with its own lock,
# wired together by path sources. See DESIGN.md §12 for why.
#
# This file holds shared dev settings only.

[project]
name = "i4h-workflows"
version = "0.1.0"
description = "Scene + workflow + task runtime for Isaac for Healthcare."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["**/.venv", "**/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]
ignore = ["E402", "B008", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["i4h_common", "i4h_engine", "i4h_workflows", "i4h_workflow_modes", "i4h_tasks", "i4h_tools", "i4h_arena", "i4h_rl"]

[tool.isort]
profile = "black"
line_length = 120
honor_noqa = true
known_first_party = ["i4h_common", "i4h_engine", "i4h_workflows", "i4h_workflow_modes", "i4h_tasks", "i4h_tools", "i4h_arena", "i4h_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
